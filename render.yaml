services:
  - type: web
    name: backenddev
    runtime: node
    plan: free
    rootDir: BackendDev
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://backenddev.hanskhan.me
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: APP_ADMIN_EMAILS
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_API_URL
        sync: false
      - key: MODEL_NAME
        sync: false
